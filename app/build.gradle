plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.tvhome.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.tvhome.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed signing key so every build is signed the same way and `adb install -r` can update in place.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
